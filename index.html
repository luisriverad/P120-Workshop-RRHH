<!DOCTYPE html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axon · Rentabilidad de RRHH</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
      ::selection { background: #feeaa0; color: #0f172a; }
      *:focus-visible { outline: 2px solid #8c6900; outline-offset: 2px; }

      /* Modo impresión: ocultar sidebar, topbar y footer; expandir contenido a página completa */
      @media print {
        @page { margin: 14mm 12mm; size: A4 portrait; }
        /* Imprimir fondos, gradientes y colores (barras de gráficas, KPIs, badges) */
        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        body { background: #fff !important; }
        .no-print { display: none !important; }
        .print-main { max-width: 100% !important; padding: 0 !important; }
        .print-page { background: #fff !important; background-image: none !important; }
        /* Mantener cada título junto a su contenido */
        h2, h3 { page-break-after: avoid; break-after: avoid; }
        /* Evitar que una tarjeta/gráfica se parta entre páginas: si no cabe, pasa entera a la siguiente.
           (Si es más alta que una página, el navegador la parte igualmente para no perder contenido.) */
        .print-keep { page-break-inside: avoid; break-inside: avoid; }
        /* Las tablas largas sí pueden fluir entre páginas, repitiendo encabezados */
        table { page-break-inside: auto; break-inside: auto; }
        thead { display: table-header-group; }
        tr, img, svg { page-break-inside: avoid; break-inside: avoid; }
        .chart-copy-btn { display: none !important; }
      }

      /* Modo impresión enfocado: exportar SOLO el plan de trabajo a PDF */
      @media print {
        body.printing-plan #root > * { visibility: hidden !important; }
        body.printing-plan .plan-print-overlay,
        body.printing-plan .plan-print-overlay * { visibility: visible !important; }
        body.printing-plan .plan-print-overlay {
          position: absolute !important; inset: 0 !important;
          background: #fff !important; backdrop-filter: none !important;
          display: block !important; padding: 0 !important; z-index: 9999 !important;
        }
        body.printing-plan .plan-print-card {
          position: absolute !important; left: 0 !important; top: 0 !important;
          width: 100% !important; max-width: 100% !important; max-height: none !important;
          overflow: visible !important; box-shadow: none !important; border: none !important;
          border-radius: 0 !important;
        }
        body.printing-plan .plan-no-print { display: none !important; }
        body.printing-plan .plan-print-card .plan-fase { page-break-inside: avoid; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
